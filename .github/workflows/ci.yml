name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --release --locked -- -D warnings
      - name: Test
        run: cargo test --release --locked
      - name: Simulate, export and independently audit
        run: |
          cargo run --release --locked --bin verify-sim -- --export chain.verify
          ID=$(cargo run -q --release --locked --bin verify-audit -- chain.verify | awk '/chain id/{print $3}')
          cargo run -q --release --locked --bin verify-audit -- chain.verify --expect-chain-id "$ID"
